<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · LibraryWeb2026</title>
    <link rel="stylesheet" href="static/css/app.css">
</head>
<body class="auth-page">
<div id="app" class="auth-card wide" v-cloak>
    <div class="auth-brand">
        <div class="logo">📝</div>
        <h1>注册新用户</h1>
        <p>选择角色后，填写对应的信息项</p>
    </div>

    <form @submit.prevent="submit">
        <div class="form-grid">
            <div class="field">
                <label for="name">姓名</label>
                <input id="name" v-model.trim="form.name" maxlength="20" placeholder="2–20 个字符" required>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" v-model="form.password" type="password" maxlength="32"
                       placeholder="6–32 个字符" required>
            </div>
            <div class="field">
                <label for="phone">手机号</label>
                <input id="phone" v-model.trim="form.phone" maxlength="11" placeholder="11 位手机号" required>
            </div>
            <div class="field">
                <label for="major">专业</label>
                <input id="major" v-model.trim="form.major" maxlength="50" placeholder="例如：计算机科学与技术" required>
            </div>
            <div class="field">
                <label for="role">角色</label>
                <select id="role" v-model="form.role">
                    <option value="学生">学生</option>
                    <option value="教师">教师</option>
                    <option value="操作员">操作员</option>
                    <option value="管理员">管理员</option>
                </select>
            </div>
            <div class="field" v-if="form.role === '管理员'">
                <label for="permissionLevel">权限等级（1–3）</label>
                <input id="permissionLevel" v-model.number="form.permissionLevel" type="number" min="1" max="3" required>
            </div>
            <div class="field" v-if="form.role === '管理员'">
                <label for="entryTime">入职时间</label>
                <input id="entryTime" v-model="form.entryTime" type="date" required>
            </div>

            <div class="field" v-if="form.role === '操作员'">
                <label for="area">负责区域</label>
                <input id="area" v-model.trim="form.area" maxlength="50" placeholder="例如：图书馆一楼" required>
            </div>
            <div class="field" v-if="form.role === '操作员'">
                <label for="duty">职务</label>
                <input id="duty" v-model.trim="form.duty" maxlength="50" placeholder="例如：图书管理员" required>
            </div>

            <div class="field" v-if="form.role === '学生'">
                <label for="grade">年级</label>
                <input id="grade" v-model.trim="form.grade" maxlength="20" placeholder="例如：2022级" required>
            </div>
            <div class="field" v-if="form.role === '学生' || form.role === '教师'">
                <label for="college">所属学院</label>
                <input id="college" v-model.trim="form.college" maxlength="50" placeholder="例如：计算机学院" required>
            </div>
            <div class="field" v-if="form.role === '教师'">
                <label for="title">职称</label>
                <input id="title" v-model.trim="form.title" maxlength="20" placeholder="例如：教授" required>
            </div>
        </div>

        <div class="error" v-if="error">{{ error }}</div>

        <div class="actions">
            <button type="submit" class="btn primary" :disabled="loading">{{ loading ? '注册中…' : '注册' }}</button>
            <a class="btn ghost" href="login.html">返回登录</a>
        </div>
    </form>
</div>

<script src="static/vendor/vue.global.prod.js"></script>
<script src="static/vendor/axios.min.js"></script>
<script src="static/vendor/jquery.min.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/register.js"></script>
</body>
</html>
