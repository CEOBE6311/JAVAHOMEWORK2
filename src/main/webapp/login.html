<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · LibraryWeb2026</title>
    <link rel="stylesheet" href="static/css/app.css">
</head>
<body class="auth-page">
<div id="app" class="auth-card" v-cloak>
    <div class="auth-brand">
        <div class="logo">📚</div>
        <h1>LibraryWeb2026</h1>
        <p>图书馆管理系统</p>
    </div>

    <form @submit.prevent="submit">
        <div class="field">
            <label for="name">用户名</label>
            <input id="name" v-model.trim="form.name" autocomplete="username" placeholder="请输入姓名" required>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" v-model="form.password" type="password" autocomplete="current-password"
                   placeholder="请输入密码" required>
        </div>
        <div class="field">
            <label for="captcha">验证码</label>
            <div class="captcha-row">
                <input id="captcha" v-model.trim="form.captcha" maxlength="4" autocomplete="off"
                       placeholder="4 位验证码" required>
                <img :src="captchaUrl" alt="验证码" title="点击刷新" @click="refreshCaptcha">
            </div>
        </div>

        <div class="error" v-if="error">{{ error }}</div>

        <div class="actions">
            <button type="submit" class="btn primary" :disabled="loading">{{ loading ? '登录中…' : '登录' }}</button>
            <button type="button" class="btn ghost" @click="reset">重置</button>
        </div>
    </form>

    <p class="link-line">还没有账号？<a href="register.html">注册新用户</a></p>
</div>

<script src="static/vendor/vue.global.prod.js"></script>
<script src="static/vendor/axios.min.js"></script>
<script src="static/vendor/jquery.min.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/login.js"></script>
</body>
</html>
